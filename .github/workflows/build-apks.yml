name: Build 2 APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Check Gradle
        run: gradle --version

      - name: Build Target APK
        run: gradle :target-app:assembleDebug --stacktrace

      - name: Build Admin APK
        run: |
          gradle :admin-app:assembleDebug \
            -PMAPS_API_KEY="${{ secrets.MAPS_API_KEY }}" \
            --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p release
          cp target-app/build/outputs/apk/debug/target-app-debug.apk \
             release/lokasi-saya-target.apk
          cp admin-app/build/outputs/apk/debug/admin-app-debug.apk \
             release/lokasi-saya-admin.apk
          ls -lh release

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: lokasi-saya-apks
          path: release/*.apk
          if-no-files-found: error
